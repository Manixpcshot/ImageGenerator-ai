[package]
name = "dreamcanvas"
version = "0.3.0"
description = "A local AI image studio"
authors = ["DreamCanvas contributors"]
edition = "2021"

[lib]
name = "dreamcanvas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
