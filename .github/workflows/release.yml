name: Build release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev patchelf rpm
      - run: npm ci
      - name: Build Linux bundles
        shell: bash
        run: |
          set -o pipefail
          npm run tauri -- build --bundles deb,appimage,rpm 2>&1 | tee build.log || { echo "::error::$(tail -40 build.log | tr '\n' ' ')"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Build Windows executable
        shell: pwsh
        run: |
          cmd /c "npm run tauri -- build --no-bundle > build.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content build.log
          if ($code -ne 0) { Write-Output "::error::$((Get-Content build.log -Tail 40) -join ' ')"; exit $code }
      # The worker resources must sit alongside the executable for portable use.
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item src-tauri/target/release/dreamcanvas.exe portable/
          Copy-Item scripts/worker.py, scripts/requirements.txt portable/
          Compress-Archive portable/* DreamCanvas-portable-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: DreamCanvas-portable-windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: DreamCanvas-portable-windows.zip
